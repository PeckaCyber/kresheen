# Dependency updates. Version updates run weekly: minor and patch updates are grouped into one PR per ecosystem, and
# every major update gets its own PR. Security updates are not grouped, so each fix lands on its own and fast (and ignores
# the cooldown). dependabot-automerge.yml merges patch, minor and security PRs once the required checks pass; majors
# are labelled `needs-review` and wait for a person.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 5
    cooldown: {default-days: 7}
    labels: [dependencies, python]
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Tools installed from hashed lists: pip-audit for the CI audit job, PyInstaller for the desktop build (`.in` is the
  # input; regenerate the `.txt` with `uv pip compile --generate-hashes --universal --python-version 3.13`).
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 2
    cooldown: {default-days: 7}
    labels: [dependencies, python]
    groups:
      ci-tools:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 5
    cooldown: {default-days: 7}
    labels: [dependencies, javascript]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 5
    cooldown: {default-days: 7}
    labels: [dependencies, github-actions]
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Base images in the Dockerfile (pinned by digest, so most updates are digest-only).
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 5
    cooldown: {default-days: 7}
    labels: [dependencies, docker]
    # The builder's Python minor must match the distroless runtime's (compiled wheels and .pyc), and the tag change
    # looks like a minor update. Move both images together by hand.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The fuzz build image (.clusterfuzzlite/Dockerfile): the OSS-Fuzz Python builder and uv, pinned by digest.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 2
    cooldown: {default-days: 7}
    labels: [dependencies, docker]
    groups:
      fuzz-images:
        applies-to: version-updates
        patterns: ["*"]

  # The Linux desktop build image (packaging/desktop/linux/Dockerfile.build): Rocky Linux 8 and uv, pinned by digest.
  # Rocky 8 stays on purpose (glibc 2.28 decides which distributions the packages run on): no major updates.
  - package-ecosystem: docker
    directory: /packaging/desktop/linux
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 2
    cooldown: {default-days: 7}
    labels: [dependencies, docker]
    ignore:
      - dependency-name: rockylinux/rockylinux
        update-types: [version-update:semver-major]
    groups:
      desktop-build-images:
        applies-to: version-updates
        patterns: ["*"]

  # Images in docker-compose.yml (the bundled PostgreSQL).
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Etc/UTC}
    open-pull-requests-limit: 3
    cooldown: {default-days: 7}
    labels: [dependencies, docker]
    # A PostgreSQL major cannot read the previous major's data directory (needs pg_upgrade). Change it by hand,
    # together with the Helm chart's values.yaml, and document the upgrade.
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    groups:
      compose-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
