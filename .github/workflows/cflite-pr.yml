# Coverage-guided fuzzing (ClusterFuzzLite with Atheris) of each pull request: the harnesses in fuzz/, built by
# .clusterfuzzlite/. A crash fails the run; the log and the run's artifacts hold the input that reproduces it.
# The actions run Google's ClusterFuzzLite images by their mutable `v1` tag; the action commit is pinned.
name: cflite-pr
on:
  pull_request:
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
