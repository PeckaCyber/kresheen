# When `ci` fails on a branch the maintainer's after-hours publisher pushed (publish/*, same repository, never a
# fork), Claude Code reads the failed logs, fixes the code and commits; a separate step pushes the commit with the
# security App's token so CI runs again and auto-merge can finish. At most two attempts per branch, then it gives
# up and notifies. The agent cannot push, cannot touch .github/ and has no merge rights; the required checks still
# decide. Code on publish/* branches comes only from the maintainer, so running it here with secrets is acceptable.
name: ci-autofix
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- gated to same-repo publish/* branches, see the header
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'publish/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      MAX_ATTEMPTS: "2"
    steps:
      - name: App token (contents and pull requests, no workflow files)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to try
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "The branch moved on since the failed run; nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q origin main
          attempts=$(git log --format=%B origin/main..HEAD | grep -c '^Autofix-Attempt:' || true)
          echo "attempt=$((attempts + 1))" >> "$GITHUB_OUTPUT"
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "giveup=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          # Failed job logs go to a file the agent reads, not into the prompt.
          gh run view "$RUN_ID" --log-failed | tail -n 600 > "$RUNNER_TEMP/ci-failure.log" || true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.gate.outputs.go == 'true'
        with:
          version: "0.13.4"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: |
          uv sync --locked --extra dev
          (cd frontend && npm ci)
          git config user.name "kresheen-security[bot]"
          git config user.email "345564174+kresheen-security[bot]@users.noreply.github.com"
      - name: Fix with Claude Code
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            The `ci` workflow failed on this branch. The failed job logs are in ${{ runner.temp }}/ci-failure.log.
            README.md and CONTRIBUTING.md describe the project and its checks. Then:
            1. Find the root cause from the logs and the code. Reproduce it with the matching local command
               (.venv/bin/python -m pytest / ruff / mypy, or npx tsc -b / npx vitest run / npm run build in frontend/).
            2. Make the smallest correct fix. Never delete, skip or loosen a test or a check to make it pass,
               never change files under .github/, and do not add dependencies.
            3. Re-run the failing command until it passes.
            4. Commit once with a short message describing the fix, ending with these two trailer lines:
               Autofix-Attempt: ${{ steps.gate.outputs.attempt }}
               Co-Authored-By: Claude <noreply@anthropic.com>
            If the failure is not caused by the code (for example a flaky network step or an outage), do not
            commit anything.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(.venv/bin/python -m pytest:*),Bash(.venv/bin/python -m ruff:*),Bash(.venv/bin/python -m mypy:*),Bash(cd frontend && npx tsc:*),Bash(cd frontend && npx vitest:*),Bash(cd frontend && npm run build:*)"
      - name: Push the fix
        id: push
        if: steps.gate.outputs.go == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ "$(git rev-list --count "$HEAD_SHA"..HEAD)" -eq 0 ]; then
            echo "No fix was committed."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$HEAD_SHA" HEAD | grep -q '^\.github/'; then
            echo "The fix touches .github/; not pushing."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Notify when no fix went up
        if: always() && (steps.gate.outputs.giveup == 'true' || steps.push.outputs.pushed == 'false' || failure())
        env:
          NOTIFY_URL: ${{ secrets.PUBLISH_NOTIFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          [ -n "$NOTIFY_URL" ] || exit 0
          curl -fsS -m 20 -H "Title: Kresheen CI autofix" -H "Priority: high" \
            -d "ci failed on ${BRANCH} and autofix did not push a fix (attempt limit, no code cause, or an error). ${RUN_URL}" \
            "$NOTIFY_URL" > /dev/null
