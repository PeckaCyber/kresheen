# Lint, types, tests, build, dependency audit, secret scan and e2e. Actions are pinned by commit SHA (tag in the comment); update them deliberately.
# uv.lock is the only lock file: jobs install from it with `uv sync --locked` (hashes are checked from the lock) or
# export it to hashed requirements for pip-audit. release.yml reuses this workflow (workflow_call).
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend (from uv.lock)
        run: |
          uv sync --locked --extra dev
          .venv/bin/python -m ruff check .
          .venv/bin/python -m mypy src/kresheen
          .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npx vitest run
          npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python dependencies (uv.lock, all extras)
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --quiet --require-hashes -r .github/requirements/pip-audit.txt
          uv export --frozen --all-extras --no-emit-project --format requirements-txt --no-header -o audit-requirements.txt
          .audit-venv/bin/pip-audit --require-hashes --no-deps --disable-pip -r audit-requirements.txt
      - name: npm production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Invisible and direction-changing characters (Trojan Source)
        run: python3 .github/scripts/unicode_check.py
      # The gitleaks binary, pinned by checksum (the gitleaks action needs a licence key for organisation repos).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend on a throwaway database
        run: |
          # Throwaway account password, generated for this run only.
          E2E_PW=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')
          echo "::add-mask::$E2E_PW"
          echo "KRESHEEN_E2E_ADMIN_PASSWORD=$E2E_PW" >> "$GITHUB_ENV"
          uv sync --locked --extra dev
          .venv/bin/kresheen create-user --db sqlite:///e2e.db --email e2e@example.test --password "$E2E_PW"
          nohup .venv/bin/kresheen serve --host 127.0.0.1 --port 8000 --db sqlite:///e2e.db > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        env:
          KRESHEEN_E2E_ADMIN_EMAIL: e2e@example.test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run e2e -- --project=chromium
      - name: Backend log
        if: failure()
        run: cat server.log

  # Static checks of what delivers and runs the app: GitHub workflows (actionlint with shellcheck, zizmor), the
  # Dockerfile (hadolint) and the Helm chart (kube-linter). Accepted exceptions are annotated where they occur.
  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the dependency check compares the lockfiles with the PR's base
      # Packages new to a lockfile must be established projects at a version a few days old: guards against names an
      # AI tool made up and an attacker registered ("slopsquatting"), look-alikes and brand-new hijacks.
      - name: Packages new to the lockfiles
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/new_deps.py "$BASE_SHA"
      - name: Install scanners
        run: for tool in actionlint zizmor hadolint kube-linter; do .github/scripts/install-tool.sh "$tool"; done
      - name: Workflows
        run: |
          actionlint
          zizmor --offline --min-severity medium .github/workflows
      - name: Dockerfile
        run: hadolint Dockerfile
      - name: Helm chart
        run: kube-linter lint deploy/helm/kresheen

  # Builds the image the way a release does and checks that it starts and answers /healthz.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t kresheen:ci .
      - name: Start and probe
        run: |
          docker run -d --name kresheen-ci -p 8123:8000 --read-only --tmpfs /data:uid=65532,gid=65532 --tmpfs /tmp:mode=1777 kresheen:ci
          ok=
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8123/healthz && ok=1 && break; sleep 1; done
          docker logs kresheen-ci | tail -5
          docker rm -f kresheen-ci >/dev/null
          test -n "$ok"
      - name: Licence check (Python packages in the image, npm packages in the lock file)
        run: |
          .github/scripts/install-tool.sh syft
          export PATH="${RUNNER_TEMP}/tools/bin:${PATH}"
          syft scan docker:kresheen:ci -q -o syft-json > "$RUNNER_TEMP/image-sbom.json"
          syft scan file:frontend/package-lock.json -q -o syft-json > "$RUNNER_TEMP/npm-sbom.json"
          python3 .github/scripts/licence_check.py "$RUNNER_TEMP/image-sbom.json" "$RUNNER_TEMP/npm-sbom.json"
