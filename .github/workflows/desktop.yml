# Desktop installers (packaging/desktop/build.py) for Linux (.tar.gz, .deb, .rpm), Windows (setup .exe, .zip) and
# macOS (.dmg, Apple silicon and Intel), each built on its own runner and smoke-tested (first launch serves the app and offers
# setup). release.yml calls this and signs and attaches the results; pull requests that touch the packaging, and a
# manual run, build them as a check. The installers are not code-signed yet. Inno Setup comes with GitHub's Windows
# image; hdiutil with macOS.
name: desktop
on:
  pull_request:
    paths:
      - packaging/desktop/**
      - src/kresheen/cli/desktop.py
      - .github/workflows/desktop.yml
      - .github/requirements/pyinstaller.txt
      - .github/requirements/macos-intel-build.txt
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false # never reuse a cache when building what gets published
      - name: Build the web interface into the package
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf ../src/kresheen/web
          cp -r dist ../src/kresheen/web
      - name: Build the installers (Linux in the glibc 2.28 build image)
        if: runner.os == 'Linux'
        run: packaging/desktop/linux/build-in-container.sh --out dist-desktop
      - name: Build the installers
        if: runner.os != 'Linux'
        run: python packaging/desktop/build.py --out dist-desktop
      - name: Smoke test (first launch)
        run: python packaging/desktop/smoke.py build/desktop/dist/kresheen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist-desktop/
          if-no-files-found: error
