# Nightly fuzzing: the property-based tests in tests/fuzz with the long `nightly` Hypothesis profile (thousands of
# generated diagrams, manifests, Terraform plans and tarballs per test). Every CI run already runs them briefly. A
# failure sends the usual failed-workflow email; the log shows the input that reproduces it.
name: fuzz-nightly
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Fuzz the parsers of untrusted input
        env:
          HYPOTHESIS_PROFILE: nightly
        run: |
          uv sync --locked --extra dev
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/fuzz
