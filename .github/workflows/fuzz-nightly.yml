# Nightly fuzzing: the property-based tests in tests/fuzz with the long `nightly` Hypothesis profile (thousands of
# generated diagrams, manifests, Terraform plans and tarballs per test), and a batch run of the coverage-guided
# Atheris harnesses in fuzz/ (ClusterFuzzLite, see cflite-pr.yml), which keeps its corpus between runs as an
# Actions artifact. Every pull request already runs both briefly. A failure sends the usual failed-workflow email; the log
# shows the input that reproduces it.
name: fuzz-nightly
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Fuzz the parsers of untrusted input
        env:
          HYPOTHESIS_PROFILE: nightly
        run: |
          uv sync --locked --extra dev
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/fuzz

  atheris:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the previous run's corpus artifact
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
