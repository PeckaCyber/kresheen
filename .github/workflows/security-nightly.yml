# Nightly security checks on main.
#
# audit          pip-audit on uv.lock (all extras), npm audit for production dependencies, and Grype on an image built
#                from main (fixable High and Critical fail). A failure sends the usual failed-workflow email.
# security-lock  If pip-audit finds vulnerable Python packages that have a fixed version, run `uv lock
#                --upgrade-package` for each; if npm audit reports production advisories at high or above, run
#                `npm audit fix --package-lock-only` (no major upgrades). Only fixed versions published at least
#                MIN_AGE_DAYS (3) ago are used, so a malicious release has time to be found and pulled first; an
#                advisory in CISA's Known Exploited Vulnerabilities catalog skips the wait. A fix that is too new is
#                picked up by a later night. Both lockfiles go in one PR,
#                `security/lockfiles`, opened or updated as the GitHub App so CI runs on it (a PR made with
#                GITHUB_TOKEN would not start CI); separate PRs would each fail the other's audit. audit-heal.yml
#                starts this workflow by hand when an audit stops a publish PR or a release. Skipped until the App is
#                configured: repository variable SECURITY_APP_ID and secret SECURITY_APP_PRIVATE_KEY.
name: security-nightly
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "security-lock: update the lock and show the diff, but push nothing"
        type: boolean
        default: false
      min_age_days:
        description: "security-lock: only use fixed versions published at least this many days ago (0 = no wait)"
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: security-nightly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install Grype
        run: .github/scripts/install-tool.sh grype
      - name: Python dependencies (pip-audit on uv.lock)
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --quiet pip-audit==2.10.1
          uv export --frozen --all-extras --no-emit-project --format requirements-txt --no-header -o "$RUNNER_TEMP/requirements.txt"
          set +e
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" --require-hashes --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt" | tee "$RUNNER_TEMP/pip-audit.txt"
          rc=${PIPESTATUS[0]}
          { echo "### pip-audit (uv.lock)"; echo '```'; cat "$RUNNER_TEMP/pip-audit.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: npm production dependencies
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          set +e
          npm audit --omit=dev --audit-level=high | tee "$RUNNER_TEMP/npm-audit.txt"
          rc=${PIPESTATUS[0]}
          { echo "### npm audit (production, high and above)"; echo '```'; cat "$RUNNER_TEMP/npm-audit.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Build the image from main
        if: ${{ !cancelled() }}
        run: docker build -t kresheen:nightly .
      - name: Grype scan (fixable High and Critical fail)
        if: ${{ !cancelled() }}
        run: |
          set +e
          grype kresheen:nightly --only-fixed --fail-on high -o table | tee "$RUNNER_TEMP/grype.txt"
          rc=${PIPESTATUS[0]}
          { echo "### Grype (image built from main, fixable only)"; echo '```'; cat "$RUNNER_TEMP/grype.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  security-lock:
    # Variables cannot be read in a step-level secret check, so the job is skipped as a whole when the App is not set up.
    if: ${{ vars.SECURITY_APP_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIN_AGE_DAYS: ${{ inputs.min_age_days || '3' }}
      KEV_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Find fixable vulnerabilities
        id: find
        run: |
          case "$MIN_AGE_DAYS" in ''|*[!0-9]*) echo "::error::min_age_days must be a whole number"; exit 1 ;; esac
          # An unreadable feed leaves the wait in place for every package (security_lock.py warns).
          curl -fsS --retry 3 --max-time 60 -o "$RUNNER_TEMP/kev.json" "$KEV_URL" || echo "::warning::could not download the CISA KEV feed"
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --quiet pip-audit==2.10.1
          uv export --frozen --all-extras --no-emit-project --format requirements-txt --no-header -o "$RUNNER_TEMP/requirements.txt"
          # pip-audit exits 1 when it finds vulnerabilities; that is expected here.
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" --require-hashes --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt" -f json -o "$RUNNER_TEMP/before.json" || true
          python .github/scripts/security_lock.py cutoffs "$RUNNER_TEMP/before.json" uv.lock "$MIN_AGE_DAYS" "$RUNNER_TEMP/kev.json" > "$RUNNER_TEMP/fixable.txt"
          if [ -s "$RUNNER_TEMP/fixable.txt" ]; then
            echo "has_fixes=true" >> "$GITHUB_OUTPUT"
            { echo "Packages with a fixed version available (only versions uploaded before the cutoff are used; none = CISA KEV or no wait):"
              sed 's/^\([^ ]*\) \(.*\)$/- \1: cutoff \2/' "$RUNNER_TEMP/fixable.txt"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Python vulnerabilities with an available fix." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update uv.lock
        id: lock
        if: steps.find.outputs.has_fixes == 'true'
        run: |
          args=()
          while read -r pkg cut; do
            if [ -z "$pkg" ]; then continue; fi
            args+=(--upgrade-package "$pkg")
            if [ "$cut" != none ]; then args+=(--exclude-newer-package "$pkg=$cut"); fi
          done < "$RUNNER_TEMP/fixable.txt"
          uv lock "${args[@]}"
          # uv records the cutoffs in uv.lock; drop them so `uv sync --locked` without the flags still accepts the lock.
          python .github/scripts/security_lock.py strip-options uv.lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock unchanged (the fixed versions are newer than ${MIN_AGE_DAYS} days or blocked by pyproject constraints)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv lock --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
          uv export --frozen --all-extras --no-emit-project --format requirements-txt --no-header -o "$RUNNER_TEMP/requirements-after.txt"
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" --require-hashes --no-deps --disable-pip -r "$RUNNER_TEMP/requirements-after.txt" -f json -o "$RUNNER_TEMP/after.json" || true
          python .github/scripts/security_lock.py body "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" > "$RUNNER_TEMP/pr-body.md"
          { echo; echo "Upload cutoffs used (minimum age ${MIN_AGE_DAYS} days; none = CISA KEV or no wait):"
            sed 's/^\([^ ]*\) \(.*\)$/- \1: \2/' "$RUNNER_TEMP/fixable.txt"; } >> "$RUNNER_TEMP/pr-body.md"
          { echo '```diff'; git diff -- uv.lock | head -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Update package-lock.json
        id: npm
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Same scope as the CI audit: production dependencies, high and above.
          if npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/npm-before.txt"; then
            echo "npm: no production advisories at high or above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q '# npm audit report' "$RUNNER_TEMP/npm-before.txt"; then
            echo "::warning::npm audit failed without a report (advisory service down?); package-lock.json left as is."
            exit 0
          fi
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-before.json" || true
          before=()
          if [ "$MIN_AGE_DAYS" -gt 0 ]; then
            if [ "$(python ../.github/scripts/security_lock.py npm-kev "$RUNNER_TEMP/npm-before.json" "$RUNNER_TEMP/kev.json")" = yes ]; then
              echo "npm: an advisory is in CISA KEV; no minimum age." >> "$GITHUB_STEP_SUMMARY"
            else
              before=(--before "$(date -u -d "${MIN_AGE_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)")
            fi
          fi
          # Lockfile only: no install scripts run, and no major upgrades (no --force).
          npm audit fix --package-lock-only --ignore-scripts "${before[@]}" || true
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json unchanged (no fix within the allowed ranges, or the fix is newer than ${MIN_AGE_DAYS} days)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/npm-after.txt" || true
          {
            echo
            echo "### npm (production dependencies, high and above)"
            echo
            echo "Updated \`frontend/package-lock.json\` with \`npm audit fix --package-lock-only ${before[*]}\` (no major upgrades)."
            echo
            echo "Before:"; echo '```'; head -60 "$RUNNER_TEMP/npm-before.txt"; echo '```'
            echo "After:"; echo '```'; head -60 "$RUNNER_TEMP/npm-after.txt"; echo '```'
          } > "$RUNNER_TEMP/npm-body.md"
          { echo '```diff'; git diff --stat -- package-lock.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push branch and open or update the PR
        if: (steps.lock.outputs.changed == 'true' || steps.npm.outputs.changed == 'true') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "kresheen-security[bot]"
          git config user.email "security-bot@users.noreply.github.com"
          if [ ! -s "$RUNNER_TEMP/pr-body.md" ]; then
            echo "Automated security update of the lockfiles, opened by the nightly security workflow." > "$RUNNER_TEMP/pr-body.md"
          fi
          if [ -s "$RUNNER_TEMP/npm-body.md" ]; then cat "$RUNNER_TEMP/npm-body.md" >> "$RUNNER_TEMP/pr-body.md"; fi
          git checkout -b security/lockfiles
          git add uv.lock frontend/package-lock.json
          git commit -q -m "Security: update lockfiles to fixed dependency versions"
          # Authenticate the push with the App token only for this command (it is not stored in the checkout).
          git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin security/lockfiles
          gh label create security --color b60205 --description "Security fix" --force
          gh label create dependencies --color 0366d6 --description "Dependency update" --force
          existing=$(gh pr list --head security/lockfiles --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md" --add-label security --add-label dependencies
            echo "Updated PR #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head security/lockfiles --title "Security: update dependency lockfiles" \
              --body-file "$RUNNER_TEMP/pr-body.md" --label security --label dependencies
          fi
