# Automatic patch release for a fixed vulnerability.
#
# Idea: the released image is scanned with Grype. If it has High or Critical vulnerabilities that have a fix, and an
# image built from main no longer has them, and every required workflow is green on main, a patch release is prepared.
#
# Flow
#   1. propose  (push to main, daily, manual) Finds the latest stable `v*` tag. Stops when main has no commits since
#      it, when a release bump is already merged and waits for its tag, when `v<next>` already exists, or when a
#      `security-release` PR is already open. Otherwise it scans both images, requires `ci` and `codeql` to be green on
#      main's head, and opens the PR "Release vX.Y.Z (security)" (label `security-release`). The PR bumps pyproject.toml,
#      uv.lock, Chart.yaml (version and appVersion) and adds a dated CHANGELOG "Security" entry listing the advisories.
#   2. dependabot-automerge.yml turns on auto-merge for that PR (it is opened by the GitHub App). It merges once the
#      required checks pass.
#   3. tag  (push to main) For the merge commit of a release PR whose version has no tag yet: waits until `ci` and
#      `codeql` are green on that commit, then creates the tag `v<version>`. The tag is created as the App, so
#      release.yml starts (a tag made with GITHUB_TOKEN would not start it).
#
# Release PRs: a `security-release` PR from step 1, or a maintainer's release bump, a PR opened by a repository admin
# whose merge commit raises the version in pyproject.toml to a stable X.Y.Z above every stable tag (the "Release X.Y.Z"
# PR). A bump must also pass release_meta.py check (Chart.yaml agrees, the CHANGELOG section is dated); if it does
# not, the job fails so the maintainer hears about it. Prereleases are still tagged by hand.
#
# Superseding a tag (workflow_dispatch with supersede=<tag>, started by audit-heal.yml): a release whose run stopped
# at the dependency audit because a new advisory appeared leaves a tag with no GitHub release. Once the lock fix is
# on main, propose skips the Grype comparison (there is no released image for that tag), lists the advisories the
# tag's lockfiles have and main's no longer have, and opens the release PR for the next patch version with a
# CHANGELOG note that it carries the superseded tag's changes. Only the latest tag, and only one without a GitHub
# release, can be superseded. Without supersede, propose stops while the latest tag has no GitHub release.
#
# Safety
#   - A commit is tagged only after the required workflows are green on that exact commit.
#   - Only a PR labelled `security-release` and opened by the App, or a release bump opened by a repository admin, can
#     lead to a tag; both must come from a branch of this repository. A tag that already exists is never moved or
#     recreated, so a version is released once; a rerun finds nothing to do.
#   - Everything is skipped, with a notice, until the App is configured (variable SECURITY_APP_ID, secret
#     SECURITY_APP_PRIVATE_KEY).
#   - If a push made by an auto-merge does not start CI (GITHUB_TOKEN rules), the wait step starts `ci` and `codeql`
#     on main itself after a few minutes.
name: security-release
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      supersede:
        description: "Latest tag whose release was stopped by the audit (no GitHub release); release the next patch"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: security-release
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - id: check
        env:
          APP_ID: ${{ vars.SECURITY_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SECURITY_APP_ID is not set, so automatic security releases are off (see the setup notes)."
            echo "Skipped: the security GitHub App is not configured (variable SECURITY_APP_ID)." >> "$GITHUB_STEP_SUMMARY"
          fi

  propose:
    needs: config
    if: needs.config.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Decide whether a release could be due
        id: plan
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SUPERSEDE: ${{ inputs.supersede }}
        run: |
          git fetch --tags --force origin
          python3 .github/scripts/security_release.py plan | tee plan.txt >> "$GITHUB_OUTPUT"
          . ./plan.txt
          stop() { echo "$1"; echo "Nothing to do: $1" >> "$GITHUB_STEP_SUMMARY"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "${latest:-}" ] || stop "no stable release tag exists yet"
          published=true
          gh release view "$latest" >/dev/null 2>&1 || published=false
          if [ -n "$SUPERSEDE" ]; then
            [ "$SUPERSEDE" = "$latest" ] || stop "$SUPERSEDE is not the latest tag ($latest)"
            [ "$published" = false ] || stop "$latest has a GitHub release; there is nothing to supersede"
            echo "supersede=$latest" >> "$GITHUB_OUTPUT"
          else
            [ "$published" = true ] || stop "$latest has no GitHub release (its release run failed or is still running)"
          fi
          [ "$commits_since" -gt 0 ] || stop "main has no commits since $latest"
          [ "$pending" = false ] || stop "a release bump is merged and waits for its tag"
          [ "$tag_exists" = false ] || stop "v$next already exists"
          open=$(gh pr list --label security-release --state open --json number --jq 'length')
          [ "$open" = 0 ] || stop "a security-release PR is already open"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Install Grype
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.supersede == ''
        run: .github/scripts/install-tool.sh grype
      - name: Scan the released image
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.supersede == ''
        env:
          LATEST: ${{ steps.plan.outputs.latest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          grype "registry:ghcr.io/peckacyber/kresheen:${LATEST#v}" --only-fixed -o json > "$RUNNER_TEMP/released.json"
      - name: Build and scan an image from main
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.supersede == ''
        run: |
          docker build -t kresheen:main-scan .
          grype docker:kresheen:main-scan --only-fixed -o json > "$RUNNER_TEMP/main.json"
      - name: Fixed in main?
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.supersede == ''
        run: |
          python3 .github/scripts/security_release.py diff "$RUNNER_TEMP/released.json" "$RUNNER_TEMP/main.json" "$RUNNER_TEMP/fixed.json" | tee -a "$GITHUB_ENV"
          { echo "### Fixable High/Critical in the released image that main no longer has"; echo '```json'; cat "$RUNNER_TEMP/fixed.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.supersede != ''
        with:
          node-version: "24"
      - name: Advisories the superseded tag has and main no longer has
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.supersede != ''
        env:
          TAG: ${{ steps.plan.outputs.supersede }}
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --quiet pip-audit==2.10.1
          git worktree add -q "$RUNNER_TEMP/tag" "$TAG"
          for side in tag main; do
            dir=.; [ "$side" = tag ] && dir="$RUNNER_TEMP/tag"
            (cd "$dir" && uv export --frozen --all-extras --no-emit-project --format requirements-txt --no-header -o "$RUNNER_TEMP/$side-req.txt")
            "$RUNNER_TEMP/audit-venv/bin/pip-audit" --require-hashes --no-deps --disable-pip -r "$RUNNER_TEMP/$side-req.txt" -f json -o "$RUNNER_TEMP/$side-pip.json" || true
            (cd "$dir/frontend" && npm audit --omit=dev --json > "$RUNNER_TEMP/$side-npm.json") || true
          done
          python3 .github/scripts/security_release.py advisories "$RUNNER_TEMP"/{tag-pip,tag-npm,main-pip,main-npm,fixed}.json | tee -a "$GITHUB_ENV"
          { echo "### Advisories in ${TAG} that main no longer has"; echo '```json'; cat "$RUNNER_TEMP/fixed.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Required workflows green on main?
        if: steps.plan.outputs.go == 'true' && env.count != '' && env.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/ci_green.py "$(git rev-parse HEAD)" --workflows "ci codeql" --timeout-minutes 45 --dispatch-missing
      - name: Open the release PR
        if: steps.plan.outputs.go == 'true' && env.count != '' && env.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NEXT: ${{ steps.plan.outputs.next }}
          SUPERSEDE: ${{ steps.plan.outputs.supersede }}
        run: |
          branch="security-release/v${NEXT}"
          git config user.name "kresheen-security[bot]"
          git config user.email "security-bot@users.noreply.github.com"
          git checkout -b "$branch"
          python3 .github/scripts/security_release.py bump "$NEXT" "$RUNNER_TEMP/fixed.json" "$(date -u +%F)" "$SUPERSEDE"
          uv lock --check
          python3 .github/scripts/release_meta.py check "v${NEXT}"
          git add pyproject.toml uv.lock deploy/helm/kresheen/Chart.yaml CHANGELOG.md
          git commit -q -m "Release v${NEXT} (security)"
          git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "$branch"
          for l in security-release:b60205 security:b60205; do gh label create "${l%%:*}" --color "${l##*:}" --force; done
          {
            if [ -n "$SUPERSEDE" ]; then
              echo "${SUPERSEDE} was tagged but its release stopped at the dependency audit. Advisories it has that main no longer has:"
            else
              echo "Fixable High and Critical vulnerabilities in the released image that main no longer has:"
            fi
            echo
            python3 -c "import json,sys; [print(f\"- {f['id']} ({f.get('severity') or 'n/a'}): {f['package']} {f['installed']}\" + (f\", fixed in {', '.join(f['fixed_in'])}\" if f['fixed_in'] else '')) for f in json.load(open(sys.argv[1]))]" "$RUNNER_TEMP/fixed.json"
            echo
            echo "Merging this PR (after the required checks) tags v${NEXT}, and release.yml then publishes the image, the PyPI package and the chart."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" --title "Release v${NEXT} (security)" \
            --body-file "$RUNNER_TEMP/pr-body.md" --label security-release --label security

  tag:
    needs: config
    if: needs.config.outputs.app == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Is this the merge of a release PR?
        id: find
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BOT_LOGIN: ${{ vars.SECURITY_BOT_LOGIN }}
        run: |
          echo "go=false" >> "$GITHUB_OUTPUT"
          pr=$(gh api "repos/${GH_REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.repo.full_name == env.GH_REPO)] | first // empty')
          if [ -z "$pr" ]; then echo "Not a pull request merge."; exit 0; fi
          author=$(jq -r '.user.login' <<<"$pr")
          if [ "$author" = "$BOT_LOGIN" ] && jq -e 'any(.labels[]; .name == "security-release")' <<<"$pr" >/dev/null; then
            kind="security release"
            version=$(python3 .github/scripts/release_meta.py check "" | sed -n 's/^version=//p')
          else
            git fetch --tags --force origin
            version=$(python3 .github/scripts/security_release.py bumped | sed -n 's/^version=//p')
            if [ -z "$version" ]; then echo "Not a release bump."; exit 0; fi
            perm=$(gh api "repos/${GH_REPO}/collaborators/${author}/permission" --jq '.permission' 2>/dev/null || echo none)
            if [ "$perm" != admin ]; then
              echo "::warning::The version bump to ${version} came from ${author} (${perm}), not a repository admin; not tagging."
              exit 0
            fi
            kind="release bump by ${author}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists; nothing to do."; exit 0
          fi
          # A bump with an undated CHANGELOG or a Chart.yaml that disagrees fails here, and the failed run emails.
          python3 .github/scripts/release_meta.py check "v${version}" >/dev/null
          echo "Tagging v${version} (${kind}) once the required workflows pass." >> "$GITHUB_STEP_SUMMARY"
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Wait for the required workflows on this commit
        if: steps.find.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_green.py "$SHA" --workflows "ci codeql" --timeout-minutes 45 --dispatch-missing
      - name: Tag the release
        if: steps.find.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          # The API refuses to create a ref that exists, so an existing tag is never moved.
          gh api "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/v${VERSION}" -f "sha=${SHA}"
          echo "Created tag v${VERSION} on ${SHA}. release.yml publishes it." >> "$GITHUB_STEP_SUMMARY"
