# Grype configuration for scans of the Kresheen image (security-nightly, security-release). Grype reads this file
# from the working directory.
#
# Go standard library advisories fixed in Go 1.26.9, matched only in the bundled Grype binary. The newest Grype
# release (v0.121.0) is still built with Go 1.26.8, so no pinnable image fixes them yet. Grype is a CLI: it runs no
# server and renders no HTML templates, and its only network traffic is the vulnerability DB download over TLS.
# The server-side, html/template and Windows-only advisories do not apply; the client-side ones need a malicious DB
# host or a network attacker. Remove these entries when a Grype release built with Go 1.26.9 or later is pinned
# (check `docker run --rm anchore/grype:<tag> version`).
ignore:
  - vulnerability: GO-2026-6599  # html/template
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6600  # html/template
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6603  # net/http HTTP/2 server
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6604  # os, Windows only
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6605  # net/http client CONNECT
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6607  # crypto/tls ECH
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6608  # net/textproto, mime/multipart
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6610  # net/http HTTP/2 transport
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6613  # net/http HTTP/1 server
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6611  # net/http HTTP/2 window updates (CPU)
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6612  # net/http HTTP/2 server flow control
    package: { name: stdlib, location: /usr/local/bin/grype }
  - vulnerability: GO-2026-6617  # net/http HTTP/2 server HPACK race
    package: { name: stdlib, location: /usr/local/bin/grype }
