# For contributors writing a migration by hand:
#   KRESHEEN_DB_URL=sqlite:////tmp/scratch.db PYTHONPATH=src alembic upgrade head   (a scratch database at head)
#   KRESHEEN_DB_URL=... PYTHONPATH=src alembic revision --autogenerate -m "add x"   (then read and edit the result)
# The application itself never reads this file; it drives Alembic from storage/migrate.py.
[alembic]
script_location = src/kresheen/storage/migrations
file_template = %%(rev)s
