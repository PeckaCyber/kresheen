apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kresheen.fullname" . }}
  labels:
    {{- include "kresheen.labels" . | nindent 4 }}
type: Opaque
stringData:
  KRESHEEN_DB_URL: {{ include "kresheen.databaseUrl" . | quote }}
  {{- /*
    KRESHEEN_SECRET_KEY encrypts stored credentials, so it must survive upgrades: use the value
    given, else the one already in the cluster, else generate a Fernet key (url-safe base64 of 32 random bytes; randBytes already base64-encodes).
  */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kresheen.fullname" .) }}
  {{- $generated := randBytes 32 | replace "+" "-" | replace "/" "_" }}
  {{- if .Values.secretKey }}
  KRESHEEN_SECRET_KEY: {{ .Values.secretKey | quote }}
  {{- else if and $existing $existing.data (index $existing.data "KRESHEEN_SECRET_KEY") }}
  KRESHEEN_SECRET_KEY: {{ index $existing.data "KRESHEEN_SECRET_KEY" | b64dec | quote }}
  {{- else }}
  KRESHEEN_SECRET_KEY: {{ $generated | quote }}
  {{- end }}
